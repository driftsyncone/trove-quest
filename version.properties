# writes the new number back here after a successful publish (commit this file afterwards).
# versionName is yours: set the next semver (and add its CHANGELOG.md entry) before publishing.
# Gradle properties -Ptrove.versionCode / -Ptrove.versionName override both for one build.
versionCode=28
versionName=0.5.5
